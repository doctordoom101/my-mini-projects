<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plagiarism Detector</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Plagiarism Detector</h1>
        <form method="POST" enctype="multipart/form-data">
            <label for="file1">Upload first PDF:</label>
            <input type="file" name="file1" accept="application/pdf" required>
            
            <label for="file2">Upload second PDF:</label>
            <input type="file" name="file2" accept="application/pdf" required>
            
            <button type="submit">Check Plagiarism</button>
        </form>

        {% if similarity is not none %}
            <div class="result {% if similarity >= 80 %}warning{% else %}success{% endif %}">
                <p>Similarity: {{ similarity }}%</p>
                {% if similarity >= 80 %}
                    <p><strong>Potential plagiarism detected!</strong></p>
                {% else %}
                    <p><strong>No plagiarism detected.</strong></p>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
