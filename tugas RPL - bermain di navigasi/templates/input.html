<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Warga</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .navbar {
            background-color: #333;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .form-container {
            max-width: 600px;
            margin: auto;
            padding-top: 20px;
        }
        label {
            display: block;
            margin-top: 10px;
        }
        input, select {
            display: block;
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border-radius: 4px;
            border: 1px solid #ccc;
        }
        button {
            margin-top: 20px;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <div class="navbar">
        <a href="/input">Input Data Warga</a>
        <a href="/dashboard">Dashboard</a>
        <span class="navbar-header">Manajemen Data Warga Kelurahan Sruput</span>
        <a href="/logout" style="float: right;">Logout</a>
    </div>

    <style>
        .navbar {
            background-color: #333;
            overflow: hidden;
            display: flex;
        }
        .navbar a {
            float: left;
            display: block;
            color: white;
            text-align: center;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar-header {
            float: left;
            color: rgb(183, 183, 183);
            font-style:inherit;
            font-size: 18px;
            padding: 14px 20px;
            margin-left: 20px;
        }
        .navbar a:hover {
            background-color: #ddd;
            color: black;
        }
        .navbar a.logout {
            float: right;
        }
    </style>

    <div class="form-container">
        <h2>Input Data Warga</h2>
        <form action="/submit" method="POST">
            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama_lengkap" required>
        
            <label for="tanggal-lahir">Tanggal Lahir (DD/MM/YYYY)</label>
            <input type="text" id="tanggal-lahir" name="tanggal_lahir" placeholder="DD/MM/YYYY" required>
        
            <label for="jenis-kelamin">Jenis Kelamin</label>
            <select id="jenis-kelamin" name="jenis_kelamin" required>
                <option value="P">Perempuan</option>
                <option value="L">Laki-laki</option>
            </select>
        
            <label for="alamat">Alamat</label>
            <input type="text" id="alamat" name="alamat" required>
        
            <label for="rt">RT</label>
            <input type="number" id="rt" name="rt" required>
        
            <label for="rw">RW</label>
            <input type="number" id="rw" name="rw" required>
        
            <label for="status-tempat-tinggal">Status Tempat Tinggal</label>
            <select id="status-tempat-tinggal" name="status_tempat_tinggal" required>
                <option value="Tetap">Tetap</option>
                <option value="Sewa">Sewa</option>
            </select>
        
            <button type="submit">Submit Data</button>
        </form>        
    </div>
</body>
</html>
